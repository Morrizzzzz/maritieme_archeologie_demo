name: Publiceer de erfgoedatlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer gegevens en code
        run: |
          node scripts/validate.mjs
          node scripts/validate-3d.mjs
          node --check app.js
          node --check map3d.js
          node --check pirate-ship.js
          node --check pirate-fallback.js
      - name: Verzamel de openbare sitebestanden
        run: |
          mkdir _site
          cp index.html style.css app.js core.mjs config.js map3d.js voyage.mjs pirate-ship.js pirate-fallback.js README.md BRONNEN.md VERIFICATIE.md LICENSE .nojekyll _site/
          cp -R assets vendor data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publiceer
        id: deployment
        uses: actions/deploy-pages@v4
